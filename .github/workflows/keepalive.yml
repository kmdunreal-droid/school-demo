name: Supabase Keepalive

# Har 2 din Subah 03:00 UTC — Supabase free project (~7 din inactivity par
# pause hota hai) ko pause hone se bachane ke liye cloud cron.
on:
  schedule:
    - cron: '0 3 */2 * *'
  workflow_dispatch: {} # Manual test: GitHub repo → Actions tab → "Run workflow"

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ping Supabase (lightweight REST keepalive)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/supabase-keepalive.cjs
